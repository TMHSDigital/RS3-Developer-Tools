name: Release

# Releases are cut manually: gh workflow run release.yml
#
# The job refuses to release a commit without a green ci.yml run, then builds
# and tests that commit itself, reads the conventional commits since the last
# tag to pick the bump, bumps every version file and the CHANGELOG, commits
# (CI runs on that commit; nothing is skipped), tags, and publishes a GitHub
# Release with the npm tarballs and the stubs zip attached and their SHA-256
# in the notes.
#
# Bump rule (also in AGENTS.md): while the major version is 0, a breaking
# change bumps the minor and a feature bumps the patch; from 1.0.0 on the
# usual major/minor/patch mapping applies.
on:
  workflow_dispatch:
    inputs:
      require_ci:
        description: "Require a successful ci.yml run for the commit being released"
        type: boolean
        default: true

permissions:
  contents: write
  actions: read
  # id-token lets npm publish with provenance through trusted publishing; no NPM_TOKEN secret is needed.
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version-and-release:
    name: Verify, bump version, tag, and release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # This job pushes to main and publishes a release, so its actions are
    # pinned to commit SHAs (version in the trailing comment).
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Require a green CI run for this commit
        if: inputs.require_ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD)
          conclusions=$(gh run list --workflow ci.yml --commit "$sha" --json conclusion --jq '[.[].conclusion] | join(",")')
          echo "ci.yml runs for $sha: ${conclusions:-none}"
          case ",$conclusions," in
            *,success,*) echo "CI succeeded for $sha" ;;
            *) echo "::error::no successful ci.yml run for $sha. Wait for CI, or re-run with require_ci=false after checking by hand."; exit 1 ;;
          esac

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install, build and test the commit being released
        run: |
          npm ci
          npm run build
          npm test
          node packages/cli/dist/cli.js validate examples/hello-counter
          node packages/cli/dist/cli.js preflight examples/hello-counter

      - name: Get current version
        id: current
        run: |
          version=$(python3 -c "import json; print(json.load(open('.cursor-plugin/plugin.json'))['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Current version: $version"

      - name: Determine bump type from commits
        id: bump
        run: |
          last_tag=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$last_tag" ]; then
            commits=$(git log --oneline --format="%s")
          else
            commits=$(git log "$last_tag"..HEAD --oneline --format="%s")
          fi
          echo "Commits since last release:"
          echo "$commits"
          bump="patch"
          if echo "$commits" | grep -qiE "^(feat|feature|fix|refactor|perf)(\(.+\))?!:|BREAKING CHANGE"; then
            bump="major"
          elif echo "$commits" | grep -qiE "^(feat|feature)(\(.+\))?:"; then
            bump="minor"
          fi
          echo "bump=$bump" >> "$GITHUB_OUTPUT"
          echo "Bump type: $bump"

      - name: Compute new version
        id: new
        run: |
          current="${{ steps.current.outputs.version }}"
          bump="${{ steps.bump.outputs.bump }}"
          IFS='.' read -r major minor patch <<< "$current"
          # First release keeps the scaffolded version; later releases follow the bump type.
          last_tag=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$last_tag" ]; then
            new_version="$current"
          elif [ "$major" -eq 0 ]; then
            # Pre-1.0: breaking changes bump the minor, features and fixes the patch.
            case "$bump" in
              major) minor=$((minor + 1)); patch=0 ;;
              *) patch=$((patch + 1)) ;;
            esac
            new_version="$major.$minor.$patch"
          else
            case "$bump" in
              major) major=$((major + 1)); minor=0; patch=0 ;;
              minor) minor=$((minor + 1)); patch=0 ;;
              patch) patch=$((patch + 1)) ;;
            esac
            new_version="$major.$minor.$patch"
          fi
          echo "version=$new_version" >> "$GITHUB_OUTPUT"
          echo "New version: $new_version"

      - name: Check if tag already exists
        id: check
        run: |
          new_version="${{ steps.new.outputs.version }}"
          if git rev-parse "v$new_version" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Tag v$new_version already exists, skipping"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update version files
        if: steps.check.outputs.skip == 'false'
        env:
          NEW_VERSION: ${{ steps.new.outputs.version }}
          OLD_VERSION: ${{ steps.current.outputs.version }}
        run: |
          python3 - <<'PYEOF'
          import json, os, glob
          new_version = os.environ['NEW_VERSION']
          old_version = os.environ['OLD_VERSION']

          def bump(path):
              with open(path, encoding='utf-8') as f:
                  data = json.load(f)
              data['version'] = new_version
              # Workspace packages depend on each other by exact version.
              for section in ('dependencies', 'devDependencies'):
                  for name, spec in list(data.get(section, {}).items()):
                      if name.startswith('@tmhs/') and spec == old_version:
                          data[section][name] = new_version
              with open(path, 'w', encoding='utf-8') as f:
                  json.dump(data, f, indent=2)
                  f.write('\n')

          bump('.cursor-plugin/plugin.json')
          bump('.claude-plugin/plugin.json')
          bump('package.json')
          for path in glob.glob('packages/*/package.json'):
              bump(path)

          if os.path.exists('README.md'):
              with open('README.md', encoding='utf-8') as f:
                  content = f.read()
              content = content.replace(f'version-{old_version}-blue', f'version-{new_version}-blue')
              with open('README.md', 'w', encoding='utf-8') as f:
                  f.write(content)
          PYEOF
          # Keep package-lock.json consistent with the bumped versions.
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Date the CHANGELOG entry
        if: steps.check.outputs.skip == 'false'
        env:
          NEW_VERSION: ${{ steps.new.outputs.version }}
        run: |
          python3 - <<'PYEOF'
          import datetime, os, re
          version = os.environ['NEW_VERSION']
          today = datetime.date.today().isoformat()
          path = 'CHANGELOG.md'
          with open(path, encoding='utf-8') as f:
              text = f.read()
          # The Unreleased section becomes this release and a fresh, empty
          # Unreleased section is left above it for the next cycle.
          if re.search(r'^## \[Unreleased\]\s*$', text, re.M):
              text = re.sub(r'^## \[Unreleased\]\s*$', f'## [Unreleased]\n\n## [{version}] - {today}', text, count=1, flags=re.M)
          elif f'## [{version}]' not in text:
              text = text.replace('## [', f'## [Unreleased]\n\n## [{version}] - {today}\n\n### Changed\n\n- Version bump only\n\n## [', 1)
          text = re.sub(rf'^## \[{re.escape(version)}\] - Unreleased\s*$', f'## [{version}] - {today}', text, flags=re.M)
          with open(path, 'w', encoding='utf-8', newline='\n') as f:
              f.write(text)
          PYEOF
          git --no-pager diff --stat -- CHANGELOG.md

      - name: Sync release docs
        if: steps.check.outputs.skip == 'false'
        uses: TMHSDigital/Developer-Tools-Directory/.github/actions/release-doc-sync@v1
        with:
          plugin-version: ${{ steps.new.outputs.version }}
          previous-version: ${{ steps.current.outputs.version }}
          meta-repo-ref: v1.20.0

      - name: Commit version bump
        if: steps.check.outputs.skip == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            # No [skip ci]: the tagged commit gets its own CI run.
            git commit -m "chore: bump version to ${{ steps.new.outputs.version }}"
            git push origin main
          fi

      - name: Create and push tags
        if: steps.check.outputs.skip == 'false'
        run: |
          new_version="${{ steps.new.outputs.version }}"
          IFS='.' read -r major minor _patch <<< "$new_version"
          git tag "v$new_version"
          git tag -f "v$major"
          git tag -f "v$major.$minor"
          git push origin "v$new_version"
          git push origin "v$major" --force
          git push origin "v$major.$minor" --force

      - name: Build release artefacts
        if: steps.check.outputs.skip == 'false'
        env:
          NEW_VERSION: ${{ steps.new.outputs.version }}
        run: |
          # Rebuild so dist/ carries the bumped version, then pack every workspace
          # package and zip the stubs for editors that do not use npm.
          npm run build
          mkdir -p release-assets
          for dir in packages/*/; do
            (cd "$dir" && npm pack --pack-destination "$GITHUB_WORKSPACE/release-assets" >/dev/null)
          done
          (cd packages/luals-stubs && zip -qr "$GITHUB_WORKSPACE/release-assets/rs3-luals-stubs-$NEW_VERSION.zip" stubs index.json unresolved.md luarc.template.json package.json README.md)
          # The LuaLS addon layout (config.json, info.json, library/) for the addon manager and non-npm editors.
          node scripts/build-luals-addon.mjs --out "$RUNNER_TEMP/luals-addon"
          (cd "$RUNNER_TEMP/luals-addon" && zip -qr "$GITHUB_WORKSPACE/release-assets/rs3-client-api-luals-addon-$NEW_VERSION.zip" .)
          (cd release-assets && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
          {
            echo "## Artefacts"
            echo
            echo "npm tarballs for every workspace package, \`rs3-luals-stubs-$NEW_VERSION.zip\` (LuaLS \`---@meta\` stubs, \`index.json\`, \`luarc.template.json\`) and \`rs3-client-api-luals-addon-$NEW_VERSION.zip\` (the same stubs in LuaLS addon layout: \`library/\`, \`config.json\`, \`info.json\`). SHA-256:"
            echo
            echo '```'
            cat release-assets/SHA256SUMS.txt
            echo '```'
            echo
          } > release-notes.md

      - name: Create GitHub Release
        if: steps.check.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.new.outputs.version }}" \
            --title "v${{ steps.new.outputs.version }}" \
            --generate-notes \
            --notes-file release-notes.md \
            release-assets/*

      # npm publishing is switched on with the repository variable NPM_PUBLISH=true
      # once the @tmhs organisation exists and each package has this workflow
      # registered as a trusted publisher on npmjs.com (Settings, Publishing
      # access). Provenance then comes from the OIDC token; no secret is stored.
      # Order follows the dependency graph so each package's dependencies exist first.
      - name: Publish to npm with provenance
        if: steps.check.outputs.skip == 'false' && vars.NPM_PUBLISH == 'true'
        env:
          NPM_CONFIG_PROVENANCE: "true"
        run: |
          node scripts/pack-check.mjs
          for workspace in packages/schema packages/core packages/stubs-generator packages/luals-stubs packages/cli packages/mcp; do
            npm publish --workspace "$workspace" --access public --provenance
          done
