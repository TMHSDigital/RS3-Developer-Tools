name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "cursor-plugin/**"
      - "mcp-tools.json"
      - "site.json"
      - ".cursor-plugin/plugin.json"
      - "assets/**"
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # This job deploys with id-token: write, so its actions are pinned to
    # commit SHAs (version in the trailing comment).
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout site template
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: TMHSDigital/Developer-Tools-Directory
          sparse-checkout: site-template
          path: _template
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - run: pip install Jinja2

      # The shared site builder expects skills/ and rules/ at the repo root;
      # this repository keeps them under cursor-plugin/, so stage a copy.
      - name: Stage site inputs
        run: |
          mkdir -p _site_src
          cp -r .cursor-plugin site.json mcp-tools.json README.md _site_src/
          cp -r cursor-plugin/skills _site_src/skills
          cp -r cursor-plugin/rules _site_src/rules
          [ -d assets ] && cp -r assets _site_src/assets || true

      - name: Build site
        run: python _template/site-template/build_site.py --repo-root _site_src --out docs

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs

      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
