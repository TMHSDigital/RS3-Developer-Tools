name: Dependency audit

# Weekly npm audit over every dependency, including dev tooling, so a new
# advisory is visible without Dependabot pull requests. Production
# dependencies are also audited on every push in ci.yml. Dependabot alerts
# are enabled on the repository for the same reason; nothing here opens a
# pull request.

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  audit:
    name: npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Audit every dependency (fails on high or critical)
        run: npm audit --audit-level=high

      - name: List outdated packages (informational)
        if: always()
        run: npm outdated || true
