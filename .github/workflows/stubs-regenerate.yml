name: Regenerate stubs

# Crawls developer.runescape.com weekly and commits regenerated stubs directly
# to main when they differ. No branches, no pull requests.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write
  discussions: write

concurrency:
  group: stubs-regenerate
  cancel-in-progress: false

env:
  # Bump the version and the hash together; the download is verified before it runs.
  LUALS_VERSION: "3.19.2"
  LUALS_SHA256_LINUX: "93ad326b10f6c00911dd8c450fa098332dbd8f9f45d1052f5636a2d54479b947"

# This job pushes to main, so its actions are pinned to commit SHAs (version in
# the trailing comment). Bump them by hand together with the other workflows.
jobs:
  regenerate:
    name: Regenerate from docs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build packages
        run: npm run build

      # The generator refuses to write (exit 2) when the crawl visited too few
      # pages or the module, symbol or unresolved-note counts moved by more than
      # the guard allows (packages/stubs-generator/src/guard.ts). A tripped guard
      # leaves an issue behind instead of a commit.
      - name: Regenerate stubs from the live documentation
        id: generate
        continue-on-error: true
        run: |
          set -o pipefail
          npm run stubs:generate 2>&1 | tee "$RUNNER_TEMP/stubs-generate.log"

      - name: Upload the generator log
        if: steps.generate.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: stubs-generate-log
          path: ${{ runner.temp }}/stubs-generate.log
          retention-days: 30

      - name: Open or update the tracking issue when the guard trips
        if: steps.generate.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Stub regeneration guard tripped"
          body=$(printf 'The weekly regeneration did not commit because the generator refused the crawl.\n\nRun: %s (the generator log is attached as an artifact).\n\n```\n%s\n```\n\nCheck whether developer.runescape.com changed its markup, fix the parser or overrides, and re-run with `--allow-shrink` only after reading the diff.' "$RUN_URL" "$(tail -n 40 "$RUNNER_TEMP/stubs-generate.log")")
          existing=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --label "stubs,bug" --body "$body"
          fi
          exit 1

      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet -- packages/luals-stubs; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Stubs are up to date."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git --no-pager diff --stat -- packages/luals-stubs
          fi

      - name: Install lua-language-server
        if: steps.diff.outputs.changed == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/luals"
          curl -sSL -o "$RUNNER_TEMP/luals.tar.gz" \
            "https://github.com/LuaLS/lua-language-server/releases/download/${LUALS_VERSION}/lua-language-server-${LUALS_VERSION}-linux-x64.tar.gz"
          echo "${LUALS_SHA256_LINUX}  $RUNNER_TEMP/luals.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/luals.tar.gz" -C "$RUNNER_TEMP/luals"
          echo "LUA_LANGUAGE_SERVER=$RUNNER_TEMP/luals/bin/lua-language-server" >> "$GITHUB_ENV"

      - name: Verify the regenerated stubs still type-check the example
        if: steps.diff.outputs.changed == 'true'
        run: |
          npm test
          node scripts/luals-check.mjs examples/hello-counter

      # The digest is the semantic diff of index.json (symbols added, removed,
      # signature changed, with docs links). It becomes the commit body, the
      # newest entry in api-changes.md and an Announcements discussion.
      - name: Write the API change digest
        if: steps.diff.outputs.changed == 'true'
        id: digest
        run: |
          git show HEAD:packages/luals-stubs/index.json > "$RUNNER_TEMP/old-index.json"
          today=$(date -u +%Y-%m-%d)
          node scripts/stubs-diff.mjs "$RUNNER_TEMP/old-index.json" packages/luals-stubs/index.json --date "$today" > "$RUNNER_TEMP/digest.md" || true
          if [ -s "$RUNNER_TEMP/digest.md" ]; then
            echo "has_digest=true" >> "$GITHUB_OUTPUT"
            echo "date=$today" >> "$GITHUB_OUTPUT"
            # Prepend under the intro: keep the header paragraphs, insert the new section before the first "## ".
            python3 - "$RUNNER_TEMP/digest.md" <<'PYEOF'
          import sys
          digest = open(sys.argv[1], encoding="utf-8").read().rstrip("\n") + "\n"
          path = "api-changes.md"
          text = open(path, encoding="utf-8").read()
          marker = text.find("\n## ")
          text = (text + "\n" + digest) if marker == -1 else (text[: marker + 1] + digest + "\n" + text[marker + 1 :])
          open(path, "w", encoding="utf-8", newline="\n").write(text)
          PYEOF
            cat "$RUNNER_TEMP/digest.md"
          else
            echo "has_digest=false" >> "$GITHUB_OUTPUT"
            echo "Stub files changed but no symbol was added, removed or re-signed."
          fi

      - name: Commit to main
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/luals-stubs api-changes.md
          if [ "${{ steps.digest.outputs.has_digest }}" = "true" ]; then
            git commit -F - <<EOF
          chore(stubs): regenerate from docs (${{ steps.digest.outputs.date }})

          $(cat "$RUNNER_TEMP/digest.md")
          EOF
          else
            git commit -m "chore(stubs): regenerate from docs"
          fi
          git push origin main

      - name: Post the digest as an Announcements discussion
        if: steps.diff.outputs.changed == 'true' && steps.digest.outputs.has_digest == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          repo_id=$(gh api graphql -f query='query($o:String!,$n:String!){repository(owner:$o,name:$n){id discussionCategories(first:20){nodes{id name}}}}' -f o="${GITHUB_REPOSITORY_OWNER}" -f n="${GITHUB_REPOSITORY#*/}" --jq '.data.repository.id')
          category_id=$(gh api graphql -f query='query($o:String!,$n:String!){repository(owner:$o,name:$n){discussionCategories(first:20){nodes{id name}}}}' -f o="${GITHUB_REPOSITORY_OWNER}" -f n="${GITHUB_REPOSITORY#*/}" --jq '.data.repository.discussionCategories.nodes[] | select(.name=="Announcements") | .id')
          if [ -z "$category_id" ]; then
            echo "No Announcements category; skipping the discussion post (api-changes.md and the commit body carry the digest)."
            exit 0
          fi
          body=$(printf '%s\n\nFull log: https://github.com/%s/blob/main/api-changes.md' "$(cat "$RUNNER_TEMP/digest.md")" "$GITHUB_REPOSITORY")
          gh api graphql -f query='mutation($r:ID!,$c:ID!,$t:String!,$b:String!){createDiscussion(input:{repositoryId:$r,categoryId:$c,title:$t,body:$b}){discussion{url}}}' \
            -f r="$repo_id" -f c="$category_id" -f t="API changes ${{ steps.digest.outputs.date }}" -f b="$body" --jq '.data.createDiscussion.discussion.url'
