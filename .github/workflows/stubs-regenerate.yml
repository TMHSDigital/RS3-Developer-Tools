name: Regenerate stubs

# Crawls developer.runescape.com weekly and commits regenerated stubs directly
# to main when they differ. No branches, no pull requests.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: stubs-regenerate
  cancel-in-progress: false

env:
  LUALS_VERSION: "3.19.2"

jobs:
  regenerate:
    name: Regenerate from docs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build packages
        run: npm run build

      # The generator refuses to write (exit 2) when the crawl visited too few
      # pages or the module, symbol or unresolved-note counts moved by more than
      # the guard allows (packages/stubs-generator/src/guard.ts). A tripped guard
      # leaves an issue behind instead of a commit.
      - name: Regenerate stubs from the live documentation
        id: generate
        continue-on-error: true
        run: |
          set -o pipefail
          npm run stubs:generate 2>&1 | tee "$RUNNER_TEMP/stubs-generate.log"

      - name: Upload the generator log
        if: steps.generate.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: stubs-generate-log
          path: ${{ runner.temp }}/stubs-generate.log
          retention-days: 30

      - name: Open or update the tracking issue when the guard trips
        if: steps.generate.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Stub regeneration guard tripped"
          body=$(printf 'The weekly regeneration did not commit because the generator refused the crawl.\n\nRun: %s (the generator log is attached as an artifact).\n\n```\n%s\n```\n\nCheck whether developer.runescape.com changed its markup, fix the parser or overrides, and re-run with `--allow-shrink` only after reading the diff.' "$RUN_URL" "$(tail -n 40 "$RUNNER_TEMP/stubs-generate.log")")
          existing=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --label "stubs,bug" --body "$body"
          fi
          exit 1

      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet -- packages/luals-stubs; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Stubs are up to date."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git --no-pager diff --stat -- packages/luals-stubs
          fi

      - name: Install lua-language-server
        if: steps.diff.outputs.changed == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/luals"
          curl -sSL -o "$RUNNER_TEMP/luals.tar.gz" \
            "https://github.com/LuaLS/lua-language-server/releases/download/${LUALS_VERSION}/lua-language-server-${LUALS_VERSION}-linux-x64.tar.gz"
          tar -xzf "$RUNNER_TEMP/luals.tar.gz" -C "$RUNNER_TEMP/luals"
          echo "LUA_LANGUAGE_SERVER=$RUNNER_TEMP/luals/bin/lua-language-server" >> "$GITHUB_ENV"

      - name: Verify the regenerated stubs still type-check the example
        if: steps.diff.outputs.changed == 'true'
        run: |
          npm test
          node scripts/luals-check.mjs examples/hello-counter

      - name: Commit to main
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/luals-stubs
          git commit -m "chore(stubs): regenerate from docs"
          git push origin main
