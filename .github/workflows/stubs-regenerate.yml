name: Regenerate stubs

# Crawls developer.runescape.com weekly and commits regenerated stubs directly
# to main when they differ. No branches, no pull requests.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: stubs-regenerate
  cancel-in-progress: false

env:
  LUALS_VERSION: "3.19.2"

jobs:
  regenerate:
    name: Regenerate from docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build packages
        run: npm run build

      - name: Regenerate stubs from the live documentation
        run: npm run stubs:generate

      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet -- packages/luals-stubs; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Stubs are up to date."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git --no-pager diff --stat -- packages/luals-stubs
          fi

      - name: Install lua-language-server
        if: steps.diff.outputs.changed == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/luals"
          curl -sSL -o "$RUNNER_TEMP/luals.tar.gz" \
            "https://github.com/LuaLS/lua-language-server/releases/download/${LUALS_VERSION}/lua-language-server-${LUALS_VERSION}-linux-x64.tar.gz"
          tar -xzf "$RUNNER_TEMP/luals.tar.gz" -C "$RUNNER_TEMP/luals"
          echo "LUA_LANGUAGE_SERVER=$RUNNER_TEMP/luals/bin/lua-language-server" >> "$GITHUB_ENV"

      - name: Verify the regenerated stubs still type-check the example
        if: steps.diff.outputs.changed == 'true'
        run: |
          npm test
          node scripts/luals-check.mjs examples/hello-counter

      - name: Commit to main
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/luals-stubs
          git commit -m "chore(stubs): regenerate from docs"
          git push origin main
