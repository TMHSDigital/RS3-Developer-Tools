name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

# A newer push to the same ref supersedes a queued run; in-flight runs on main
# finish so every commit keeps its CI evidence for release.yml.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  LUALS_VERSION: "3.19.2"

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build packages
        run: npm run build

      - name: Unit tests (core, cli, mcp, stubs-generator, schema, repository)
        run: npm test

      - name: Validate and preflight the example plugin
        run: |
          node packages/cli/dist/cli.js validate examples/hello-counter
          node packages/cli/dist/cli.js preflight examples/hello-counter

      - name: Install lua-language-server (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/luals"
          curl -sSL -o "$RUNNER_TEMP/luals.tar.gz" \
            "https://github.com/LuaLS/lua-language-server/releases/download/${LUALS_VERSION}/lua-language-server-${LUALS_VERSION}-linux-x64.tar.gz"
          tar -xzf "$RUNNER_TEMP/luals.tar.gz" -C "$RUNNER_TEMP/luals"
          echo "LUA_LANGUAGE_SERVER=$RUNNER_TEMP/luals/bin/lua-language-server" >> "$GITHUB_ENV"

      - name: Install lua-language-server (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dest = Join-Path $env:RUNNER_TEMP "luals"
          New-Item -ItemType Directory -Force $dest | Out-Null
          $zip = Join-Path $env:RUNNER_TEMP "luals.zip"
          Invoke-WebRequest -Uri "https://github.com/LuaLS/lua-language-server/releases/download/$env:LUALS_VERSION/lua-language-server-$env:LUALS_VERSION-win32-x64.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dest -Force
          "LUA_LANGUAGE_SERVER=$dest\bin\lua-language-server.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: LuaLS check of examples against the generated stubs
        run: node scripts/luals-check.mjs examples/hello-counter

      - name: LuaLS check of a scaffolded plugin (plain and --prettyui)
        run: |
          node packages/cli/dist/cli.js init "${{ runner.temp }}/scaffold-plain" --permissions chatAccess --no-agent-files
          node scripts/luals-check.mjs "${{ runner.temp }}/scaffold-plain"
          node packages/cli/dist/cli.js init "${{ runner.temp }}/scaffold-prettyui" --prettyui --no-agent-files
          node scripts/luals-check.mjs "${{ runner.temp }}/scaffold-prettyui"
