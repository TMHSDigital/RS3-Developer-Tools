name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

# A newer push to the same ref supersedes a queued run; in-flight runs on main
# finish so every commit keeps its CI evidence for release.yml.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Bump the version and both hashes together; the download is verified before it runs.
  LUALS_VERSION: "3.19.2"
  LUALS_SHA256_LINUX: "93ad326b10f6c00911dd8c450fa098332dbd8f9f45d1052f5636a2d54479b947"
  LUALS_SHA256_WINDOWS: "4a3dc851b3b31e7b75a23f645d1ba4a2137579a55f5fa4edbb17a3e2a6254044"
  LUALS_SHA256_MACOS_ARM64: "79149584320a23bd5fcd5bc31f47a1975acd8a4560a0e89036bb1016fa61687f"

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        node: [22, 24]
        # One macOS leg (Node 24) proves the darwin client root, path handling and the arm64 LuaLS build.
        include:
          - os: macos-latest
            node: 24
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Fails on high or critical findings; a registry outage is a warning, not a failure.
      - name: Audit production dependencies (dev tooling is audited weekly by audit.yml)
        run: node scripts/audit-check.mjs --omit=dev --level high

      - name: Build packages
        run: npm run build

      - name: Lint and format check (Biome)
        run: npm run lint

      - name: Check what each package would publish (npm pack --dry-run)
        run: node scripts/pack-check.mjs

      - name: Unit tests (one vitest run over the repository tests and every package) with coverage
        run: npm run test:coverage

      - name: Validate, preflight and package every example
        shell: bash
        run: |
          for example in examples/*/; do
            name=$(basename "$example")
            node packages/cli/dist/cli.js validate "$example"
            node packages/cli/dist/cli.js preflight "$example"
            # Plugin tests run outside the client against the fakes generated from the stubs.
            node packages/cli/dist/cli.js test "$example"
            node packages/cli/dist/cli.js package "$example" --allow-placeholder-email --out "${{ runner.temp }}/$name.zip"
            # The shipped manifest must sit at the archive root and carry no editor-only $schema key.
            node -e '
              const { unzipSync } = require("fflate");
              const fs = require("fs");
              const [zip, name] = process.argv.slice(1);
              const entries = unzipSync(new Uint8Array(fs.readFileSync(zip)));
              if (!entries["plugin.json"] || !entries["main.lua"]) throw new Error(name + ": plugin.json or main.lua is not at the archive root");
              const manifest = JSON.parse(Buffer.from(entries["plugin.json"]).toString("utf8"));
              if ("$schema" in manifest) throw new Error(name + ": shipped plugin.json still has $schema");
              console.log(name + ": " + Object.keys(entries).length + " entries, manifest ok");
            ' "${{ runner.temp }}/$name.zip" "$name"
          done

      - name: Install lua-language-server (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/luals"
          curl -sSL -o "$RUNNER_TEMP/luals.tar.gz" \
            "https://github.com/LuaLS/lua-language-server/releases/download/${LUALS_VERSION}/lua-language-server-${LUALS_VERSION}-linux-x64.tar.gz"
          echo "${LUALS_SHA256_LINUX}  $RUNNER_TEMP/luals.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/luals.tar.gz" -C "$RUNNER_TEMP/luals"
          echo "LUA_LANGUAGE_SERVER=$RUNNER_TEMP/luals/bin/lua-language-server" >> "$GITHUB_ENV"

      - name: Install lua-language-server (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/luals"
          curl -sSL -o "$RUNNER_TEMP/luals.tar.gz" \
            "https://github.com/LuaLS/lua-language-server/releases/download/${LUALS_VERSION}/lua-language-server-${LUALS_VERSION}-darwin-arm64.tar.gz"
          echo "${LUALS_SHA256_MACOS_ARM64}  $RUNNER_TEMP/luals.tar.gz" | shasum -a 256 -c -
          tar -xzf "$RUNNER_TEMP/luals.tar.gz" -C "$RUNNER_TEMP/luals"
          echo "LUA_LANGUAGE_SERVER=$RUNNER_TEMP/luals/bin/lua-language-server" >> "$GITHUB_ENV"

      - name: Install lua-language-server (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dest = Join-Path $env:RUNNER_TEMP "luals"
          New-Item -ItemType Directory -Force $dest | Out-Null
          $zip = Join-Path $env:RUNNER_TEMP "luals.zip"
          Invoke-WebRequest -Uri "https://github.com/LuaLS/lua-language-server/releases/download/$env:LUALS_VERSION/lua-language-server-$env:LUALS_VERSION-win32-x64.zip" -OutFile $zip
          $actual = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          if ($actual -ne $env:LUALS_SHA256_WINDOWS) { throw "LuaLS archive hash mismatch: expected $env:LUALS_SHA256_WINDOWS, got $actual" }
          Expand-Archive -Path $zip -DestinationPath $dest -Force
          "LUA_LANGUAGE_SERVER=$dest\bin\lua-language-server.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: LuaLS check of every example against the generated stubs
        shell: bash
        run: |
          for example in examples/*/; do
            node scripts/luals-check.mjs "$example"
          done

      - name: LuaLS check of every scaffold template (plus --prettyui)
        shell: bash
        run: |
          for template in window event library minimal; do
            node packages/cli/dist/cli.js init "${{ runner.temp }}/scaffold-$template" --template "$template" --permissions chatAccess --no-agent-files
            node packages/cli/dist/cli.js validate "${{ runner.temp }}/scaffold-$template"
            node packages/cli/dist/cli.js test "${{ runner.temp }}/scaffold-$template"
            node scripts/luals-check.mjs "${{ runner.temp }}/scaffold-$template"
          done
          node packages/cli/dist/cli.js init "${{ runner.temp }}/scaffold-prettyui" --prettyui --no-agent-files
          node scripts/luals-check.mjs "${{ runner.temp }}/scaffold-prettyui"
